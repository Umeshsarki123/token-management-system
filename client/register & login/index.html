<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<title>Hospital Token System</title>
		<link
			rel="stylesheet"
			href="style.css" />
	</head>

	<body>
		<!-- REGISTER -->
		<section
			id="register"
			class="page">
			<div class="form-container">
				<h2>Hospital Token Form</h2>

				<form action="#token">
					<input
						type="text"
						placeholder="Full Name"
						required />
					<input
						type="tel"
						placeholder="Phone Number"
						required />
					<input
						type="date"
						required />

					<select required>
						<option
							value=""
							disabled
							selected>
							Select Blood Group
						</option>
						<option>A+</option>
						<option>A-</option>
						<option>B+</option>
						<option>B-</option>
						<option>AB+</option>
						<option>AB-</option>
						<option>O+</option>
						<option>O-</option>
					</select>

					<button type="submit">Get Token</button>
				</form>

				<a
					href="#login"
					class="back-link">
					Already have a token?
				</a>
			</div>
		</section>

		<!-- LOGIN -->
		<section
			id="login"
			class="page">
			<div class="form-container">
				<h2>Token Details</h2>

				<form action="#token">
					<input
						type="tel"
						placeholder="Phone Number"
						required />
					<input
						type="text"
						placeholder="Token ID"
						required />
					<button type="submit">Get Details</button>
				</form>

				<a
					href="#register"
					class="back-link">
					Don’t have a token?
				</a>
			</div>
		</section>
	</body>
</html>
